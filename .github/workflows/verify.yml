name: Verify procurement platform
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r backend/requirements.lock && .venv/bin/pip install -e ./backend
      - run: .venv/bin/python scripts/configure.py
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: .venv/bin/python scripts/verify.py
      - run: .venv/bin/python scripts/e2e.py
      - run: .venv/bin/python scripts/configure_staging.py
      - run: docker compose -f deploy/compose.yml build --quiet
      - run: .venv/bin/python scripts/verify_staging.py
      - if: always()
        run: docker compose -f deploy/compose.yml stop
