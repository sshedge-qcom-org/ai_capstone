name: ai-procurement-staging

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file: runtime/staging.env
    volumes:
      - procurement-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    depends_on:
      backend: {condition: service_healthy}
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--cacert", "/data/caddy/pki/authorities/local/root.crt", "https://localhost:8443/api/v1/health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

volumes:
  procurement-data:
  caddy-data:
  caddy-config:
